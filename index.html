<div class="moonlit-sprite-avatar-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Moonlit Sprite Avatar</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="flex-container">
                <label class="checkbox_label">
                    <input type="checkbox" id="moonlit_sprite_enable">
                    <span>啟用立繪取代頭像 (Enable Sprite Avatar)</span>
                </label>
            </div>
            <small style="opacity: 0.7; margin-top: 4px; display: block;">
                開啟後，對話框頭像會自動同步為角色當前的表情立繪。
            </small>
        </div>
    </div>
</div>
